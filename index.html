<!doctype html><html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gouden Quiz</title>
<style>
:root{--bg:#04150e;--bg2:rgba(6,40,28,.82);--gold:#e6bd55;--ink:#f7f0dc;--mut:#b5c2b4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) url(achtergrond.jpg) center top/cover fixed no-repeat;min-height:100vh;color:var(--ink);font:17px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:18px 16px 10px}
#ver{text-align:center;color:var(--mut);font-size:.8em;padding:0 0 140px}
h1,h2{font-family:Georgia,serif;font-weight:700;margin:.3em 0}
h1{font-size:2.6em;color:var(--gold);text-align:center;margin:.6em 0 .2em;text-shadow:0 0 18px rgba(230,189,85,.35)}h2{font-size:1.35em}
.b{display:block;width:100%;margin:8px 0;padding:14px;border:2px solid var(--gold);border-radius:10px;background:var(--bg2);color:var(--ink);font:inherit;font-weight:600}
.b:active{background:var(--gold);color:var(--bg)}
.b,.car{backdrop-filter:blur(2px)}
.row{display:flex;gap:8px}.row .b{flex:1}
input[type=text],input[type=number],#nm,#tx,#hp{width:100%;padding:14px;border-radius:10px;border:2px solid var(--mut);background:#fff;color:#222;font:inherit;margin:8px 0}
.top{display:flex;justify-content:flex-end;gap:14px;color:var(--mut)}
.cd{font:700 2.6em Georgia,serif;color:var(--gold);text-align:center;margin:10px 0}
.ok{color:var(--gold);font-weight:700}.tip,small{color:var(--mut)}
.r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bg2)}
.r b{color:var(--gold);white-space:nowrap}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g img{width:100%;border-radius:8px;border:2px solid var(--bg2);display:block}
.car{display:flex;justify-content:space-between;font:700 1.3em Georgia,serif;padding:10px 14px;margin:6px 0;border-radius:10px;background:var(--bg2)}
.car.w{background:var(--gold);color:var(--bg)}
.hb{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#000d}
.hb .hs{flex-basis:100%;text-align:center;font-size:.9em}
.hb button{flex:1;padding:12px;border-radius:8px;border:0;background:#2b4a3c;color:var(--ink);font:inherit;font-weight:600}
.hb button.rdy{background:var(--gold);color:var(--bg)}
.hb button.sm{flex:0 0 auto;background:#4a2b2b}
</style></head><body><div id="app"></div><div id="ver"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script><script src="vragen.js"></script>
<script>
firebase.initializeApp(CONFIG.firebase);
const db=firebase.database(),R=db.ref('rooms/'+CONFIG.ROOM);
const VERSIE='1.6';
const $=id=>document.getElementById(id);
document.getElementById('ver').textContent='Versie '+VERSIE;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
let off=0,S={phase:'lobby',idx:-1},P={},A={},V={},sig='',curKey='',fired=false;
let me=localStorage.getItem('g50pid'),host=localStorage.getItem('g50host')==='1';
db.ref('.info/serverTimeOffset').on('value',s=>off=s.val()||0);
const now=()=>Date.now()+off;
R.on('value',s=>{const v=s.val()||{};S=v.state||{phase:'lobby',idx:-1};P=v.players||{};A=v.answers||{};V=v.votes||{};
 render()});

function render(){const my=(A[S.idx]||{})[me],mv=(V[S.idx]||{})[me];
 const s=[S.phase,S.idx,!!S.ind,!!P[me],!!my,!!mv,Object.keys(P).length,host].join();if(s===sig)return;sig=s;draw()}
function draw(){const q=VRAGEN[S.idx];let h;
 if(!P[me])h=joinH();else if(S.phase==='lobby')h=lobbyH();else if(S.phase==='q')h=qH(q);
 else if(S.phase==='vote')h=voteH(q);else if(S.phase==='reveal')h=revealH(q);else h=endH();
 $('app').innerHTML=h+(host?hostBar():'')}
function hostBar(){const p=S.phase;let h='<div class="hb">';
 if(p==='q'||p==='vote')h+='<div id="hs" class="hs"></div>'+(p==='q'?'<button onclick="plus15()">+15 sec</button>':'')+'<button id="hn" onclick="toReveal()">Toon uitslag</button>';
 else if(p==='end'&&!S.ind)h+='<button class="rdy" onclick="showInd()">Toon individuele stand</button>';
 else if(p==='reveal')h+=`<button class="rdy" onclick="nextQ(${S.idx})">${S.idx+1<VRAGEN.length?'Volgende vraag':'Eindstand'}</button>`;
 return h+'<button class="sm" onclick="resetG()">Alles wissen</button></div>'}

function joinH(){return `<h1>Gouden Quiz</h1><h2>Voor ons gouden bruidspaar</h2><input id="nm" placeholder="Jouw naam" maxlength="14"><p>In welke auto zit je?</p><div class="row">${CONFIG.CARS.map((c,i)=>`<button class="b" onclick="join(${i})">${esc(c)}</button>`).join('')}</div>`}
function join(c){const n=$('nm').value.trim();if(!n){alert('Vul eerst je naam in');return}
 me=me||Math.random().toString(36).slice(2,9);localStorage.setItem('g50pid',me);R.child('players/'+me).set({n,c})}
function lobbyH(){let h=`<h1>Gouden Quiz</h1><p>Wacht tot de host het spel start.</p>`;
 CONFIG.CARS.forEach((c,i)=>{h+=`<h2>${esc(c)}</h2><p>${Object.values(P).filter(p=>p.c===i).map(p=>esc(p.n)).join(', ')||'-'}</p>`});
 if(host)h+=`<button class="b" onclick="go('q',0)">Start het spel</button>`;
 else h+=`<div id="hl"><button class="b" onclick="hostForm()">Ik ben host</button></div>`;return h}
function hostForm(){$('hl').innerHTML='<input id="hp" type="password" inputmode="numeric" autocomplete="off" placeholder="Pincode"><button class="b" onclick="checkPin()">Bevestigen</button>'}
function checkPin(){if($('hp').value===CONFIG.HOST_PIN){host=true;localStorage.setItem('g50host','1');sig='';render()}else{alert('Onjuiste pincode');$('hp').value=''}}

function qH(q){const my=(A[S.idx]||{})[me];
 let h=`<div class="top"><span>Vraag ${S.idx+1} van ${VRAGEN.length}</span><span id="tm"></span></div><div id="cd" class="cd"></div><h2>${esc(q.q)}</h2>`;
 if(q.tip)h+=`<p class="tip">${esc(q.tip)}</p>`;
 if(/^https?:\/\//.test(q.link||''))h+=`<a id="lk" class="b" style="display:none;text-align:center;text-decoration:none" href="${esc(q.link)}" target="_blank" rel="noopener">Open nummer in Spotify</a>`;
 if(my)return h+`<p class="ok">Antwoord verstuurd</p><p id="cnt" class="tip"></p>`;
 h+='<p id="tu" class="ok" style="display:none">De tijd is om. Wacht op de host.</p><div id="inp" style="display:none">';
 if(q.t==='mc')h+=q.o.map((o,i)=>`<button class="b" onclick="ans(${i})">${esc(o)}</button>`).join('');
 else if(q.t==='photo')h+=`<input type="file" accept="image/*" capture="environment" onchange="photo(this)"><p class="tip">Maak een foto of kies er een.</p>`;
 else h+=`<input id="tx" type="${q.t==='guess'?'text':'text'}" inputmode="${q.t==='guess'?'decimal':'text'}" placeholder="Jouw antwoord" autocomplete="off"><button class="b" onclick="sendTx()">Versturen</button>`;
 return h+'</div><p id="cnt" class="tip"></p>'}
function sendTx(){const q=VRAGEN[S.idx],t=$('tx').value.trim();
 ans(q.t==='guess'?parseFloat(t.replace(/\./g,'').replace(',','.')):t)}
function ans(v){const n=now();if(n<S.start||n>S.end+1500||(A[S.idx]||{})[me]||v===''||v!==v)return;R.child('answers/'+S.idx+'/'+me).set({v})}
function photo(el){const f=el.files[0];if(!f)return;const i=new Image();
 i.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,360/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;
  c.getContext('2d').drawImage(i,0,0,c.width,c.height);ans(c.toDataURL('image/jpeg',.6))};i.src=URL.createObjectURL(f)}

function voteH(q){const a=A[S.idx]||{},mv=(V[S.idx]||{})[me];
 let h=`<div class="top"><span>Stemronde</span></div><h2>Stem op de beste foto</h2><p class="tip">${esc(q.q)}</p>`;
 if(mv)return h+`<p class="ok">Stem verstuurd</p><p id="cnt" class="tip"></p>`;
 h+='<div class="g">';for(const k in a)if(k!==me)h+=`<img src="${a[k].v}" onclick="vote('${k}')">`;return h+'</div>'}
function vote(k){if((V[S.idx]||{})[me])return;R.child('votes/'+S.idx+'/'+me).set(k)}

function lev(a,b){let d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let pr=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,pr+(a[i-1]===b[j-1]?0:1));pr=t}}return d[b.length]}
function match(v,list){const x=norm(v);if(!x)return 0;let best=0;
 for(const c of list){const y=norm(c);if(!y)continue;if(x===y)return 1;if(y.length>=4&&x.includes(y))return 1;
  const t=y.length<=3?0:y.length<=6?1:2;
  if(lev(x,y)<=t||(x.length>=4&&y.includes(x)&&x.length>=y.length*.6))best=.5}
 return best}
function pts(i){const q=VRAGEN[i],a=A[i]||{},r={},p=q.p||10;
 if(q.t==='mc')for(const k in a)if(+a[k].v===q.a)r[k]=p;
 if(q.t==='open'||q.t==='music')for(const k in a){const m=match(a[k].v,q.a);if(m)r[k]=Math.round(p*m)}
 if(q.t==='guess'){let b=1e18;for(const k in a)b=Math.min(b,Math.abs(a[k].v-q.a));for(const k in a)if(Math.abs(a[k].v-q.a)===b)r[k]=p}
 if(q.t==='photo'){const v=V[i]||{};for(const k in v)r[v[k]]=(r[v[k]]||0)+5}return r}
function totals(){const t={};for(const k in P)t[k]=0;const last=(S.phase==='q'||S.phase==='vote')?S.idx-1:S.idx;
 for(let i=0;i<=last;i++){const r=pts(i);for(const k in r)if(k in t)t[k]+=r[k]}return t}
function board(fin){const t=totals(),c=CONFIG.CARS.map(()=>0);for(const k in t)c[P[k].c]+=t[k];
 const top=Math.max(...c);
 let h=CONFIG.CARS.map((n,i)=>`<div class="car ${fin&&c[i]===top?'w':''}"><span>${esc(n)}</span><span>${c[i]}</span></div>`).join('');
 if(!fin)return h;
 if(!S.ind)return h+'<p class="tip">De individuele stand wordt zo onthuld...</p>';
 h+='<h2>Individueel</h2>'+Object.keys(t).sort((a,b)=>t[b]-t[a]).map(k=>`<div class="r"><span>${esc(P[k].n)} <small>${esc(CONFIG.CARS[P[k].c])}</small></span><b>${t[k]}</b></div>`).join('');return h}
function revealH(q){const a=A[S.idx]||{},r=pts(S.idx);let h=`<div class="top"><span>Uitslag</span></div><h2>${esc(q.q)}</h2>`;
 if(q.t==='mc')h+=`<p class="ok">Goed antwoord: ${esc(q.o[q.a])}</p>`;
 if(q.t==='open'||q.t==='music')h+=`<p class="ok">Goed antwoord: ${esc(q.a[0])}</p>`;
 if(q.t==='guess')h+=`<p class="ok">Antwoord: ${q.a.toLocaleString('nl-NL')}</p>`;
 if(q.t==='photo'){h+='<div class="g">'+Object.keys(a).map(k=>`<div><img src="${a[k].v}"><small>${esc(P[k]?P[k].n:'?')} +${r[k]||0}</small></div>`).join('')+'</div>'}
 else h+=Object.keys(P).map(k=>{const x=a[k];const s=!x?'-':q.t==='mc'?q.o[x.v]:x.v;return `<div class="r"><span>${esc(P[k].n)}: ${esc(s)}</span><b>+${r[k]||0}</b></div>`}).join('');
 return h+'<h2>Tussenstand</h2>'+board(false)}
function endH(){return `<h1>Eindstand</h1>`+board(true)}

function go(ph,idx){const q=VRAGEN[idx],n=now(),st={phase:ph,idx};
 if(ph==='q'){st.start=n+(q.wacht||3)*1000;st.end=st.start+(q.tijd||20)*1000}
 else{st.start=n;st.end=n+(ph==='vote'?30000:12000)}R.child('state').set(st)}
function nextQ(i){if(S.phase!=='reveal'||S.idx!==i)return;S.idx+1<VRAGEN.length?go('q',S.idx+1):R.child('state').set({phase:'end',idx:S.idx})}
function showInd(){R.child('state/ind').set(true)}
function plus15(){if(S.phase==='q')R.child('state/end').set(now()+15000)}
function toReveal(){if(S.phase!=='q'&&S.phase!=='vote')return;const q=VRAGEN[S.idx];go(S.phase==='q'&&q.t==='photo'&&Object.keys(A[S.idx]||{}).length>1?'vote':'reveal',S.idx)}
function resetG(){if(confirm('Alles wissen, ook alle spelers? Iedereen kiest daarna opnieuw naam en auto.'))R.remove()}

setInterval(()=>{const n=now(),q=VRAGEN[S.idx],a=A[S.idx]||{},ids=Object.keys(P);
 if($('tm'))$('tm').textContent=Math.max(0,Math.ceil((S.end-n)/1000))+' s';
 if($('cd')){const d=Math.ceil((S.start-n)/1000);$('cd').textContent=d>0?(q.t==='music'?'Muziek start over ':'Start over ')+d:'';
  if($('inp'))$('inp').style.display=(d>0||n>S.end)?'none':'block';
  if($('tu'))$('tu').style.display=(d<=0&&n>S.end)?'block':'none';
  if($('lk'))$('lk').style.display=d<=0?'block':'none'}
 if($('cnt')){const c=S.phase==='vote'?Object.keys(V[S.idx]||{}).length:Object.keys(a).length;$('cnt').textContent=c+' van '+ids.length+' klaar'}
 if($('hs')){const src=S.phase==='vote'?(V[S.idx]||{}):a;
  const all=ids.length>0&&ids.every(k=>src[k]);
  $('hs').textContent=CONFIG.CARS.map((c,i)=>{const m=ids.filter(k=>P[k].c===i);return c+' '+m.filter(k=>src[k]).length+'/'+m.length}).join('  |  ')+(all?'  ✓ iedereen klaar':'');
  $('hn').classList.toggle('rdy',all)}
},500);
</script></body></html>
